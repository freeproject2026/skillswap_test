<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="ssGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="ssGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="ssGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark: Intertwined Dynamic Skill Swap Arrows forming an S -->
  <g transform="translate(6, 6)" filter="url(#ssGlow)">
    <!-- Outer rounded base circle/squircle -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#ssGradient2)" />
    
    <!-- Top Skill Loop Arrow (Teal) -->
    <path d="M14 20 C14 15, 20 12, 28 12 L34 12 M34 12 L30 8 M34 12 L30 16" 
          stroke="url(#ssGradient1)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom Swap Loop Arrow (Vibrant Teal) -->
    <path d="M34 28 C34 33, 28 36, 20 36 L14 36 M14 36 L18 40 M14 36 L18 32" 
          stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Central Connection Node / Spark -->
    <circle cx="24" cy="24" r="3.5" fill="#FFFFFF" />
    <circle cx="24" cy="24" r="5" stroke="url(#ssGradient1)" stroke-width="1.5" stroke-opacity="0.8" />
    
    <!-- Academic Cap Accent / Sparkle at top right -->
    <path d="M36 10 L39 12 L36 14 L33 12 Z" fill="#2DD4BF" />
  </g>

  <!-- Typography -->
  <text x="64" y="37" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="-0.5">
    <tspan fill="#0F172A">Skill</tspan><tspan fill="#0D9488">Swap</tspan>
  </text>
  
  <!-- Subtle Tagline/Dot -->
  <circle cx="188" cy="33" r="3" fill="#14B8A6" />
</svg>

